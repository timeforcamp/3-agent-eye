      <!-- catchlight highlights -->
      <ellipse cx="558" cy="358" rx="28" ry="20" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="548" cy="350" rx="10" ry="7" fill="#ffffff"/>
      <circle cx="640" cy="430" r="6" fill="#ffffff" opacity="0.7"/>
      <circle cx="660" cy="380" r="3" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- upper lid shadow on sclera -->
    <path d="M 180 400 Q 600 140 1020 400 L 1020 240 L 180 240 Z" fill="url(#upperLidShade)" opacity="0.7"/>
  </g>

  <!-- waterline (lower lid edge highlight) -->
  <path d="M 195 408 Q 600 660 1025 408" stroke="#f7e2cf" stroke-width="6" fill="none" opacity="0.75"/>
  <path d="M 195 412 Q 600 668 1025 412" stroke="#d4a585" stroke-width="3" fill="none" opacity="0.6"/>

