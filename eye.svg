<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="18%" stop-color="#0a0a0a"/>
      <stop offset="22%" stop-color="#3b6b4a"/>
      <stop offset="55%" stop-color="#6fb38a"/>
      <stop offset="85%" stop-color="#2e6a4a"/>
      <stop offset="100%" stop-color="#0d2a1d"/>
    </radialGradient>
    <radialGradient id="irisGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d6f5e3" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#d6f5e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sclera" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fefefe"/>
      <stop offset="70%" stop-color="#f3ece6"/>
      <stop offset="100%" stop-color="#d9c4b8"/>
    </radialGradient>
    <linearGradient id="upperLidShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skinTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9c6a8"/>
      <stop offset="100%" stop-color="#c99a78"/>
    </linearGradient>
    <linearGradient id="skinBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a585"/>
      <stop offset="100%" stop-color="#e7c2a4"/>
    </linearGradient>
    <radialGradient id="brow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a2418"/>
      <stop offset="100%" stop-color="#3a2418" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="eyeShape">
      <path d="M 180 400 Q 600 140 1020 400 Q 600 660 180 400 Z"/>
    </clipPath>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <!-- skin background -->
  <rect width="1200" height="800" fill="url(#skinTop)"/>
  <rect width="1200" height="800" y="400" fill="url(#skinBottom)" opacity="0.85"/>

  <!-- eyebrow base shadow -->
  <ellipse cx="600" cy="170" rx="380" ry="40" fill="url(#brow)" opacity="0.55" filter="url(#blur8)"/>

  <!-- eyebrow hairs -->
