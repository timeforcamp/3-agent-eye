  <!-- under-eye soft crease -->
  <path d="M 200 460 Q 600 700 1000 460" stroke="#a8765a" stroke-width="3" fill="none" opacity="0.35" filter="url(#blur4)"/>
  <path d="M 220 540 Q 600 760 980 540" stroke="#a8765a" stroke-width="2" fill="none" opacity="0.25" filter="url(#blur8)"/>

  <!-- eyelid crease above -->
  <path d="M 220 340 Q 600 230 980 340" stroke="#7a4a30" stroke-width="3" fill="none" opacity="0.45" filter="url(#blur4)"/>

  <!-- sclera (white of eye) clipped to eye shape -->
